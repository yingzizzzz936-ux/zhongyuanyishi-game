<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>休眠舱定位系统</title>
<style>
* { box-sizing: border-box; margin: 0; padding: 0; }
body { font-family: "Consolas", monospace; background: #222; }
.browser {
    width: 100%; max-width: 1200px; margin: 20px auto;
    background: #f1f1f1; border-radius: 8px; overflow: hidden;
}
.browser-top {
    background: #dcdcdc; padding: 8px 12px;
    display: flex; align-items: center; gap: 10px;
    border-bottom: 1px solid #bbb;
}
.back-btn {
    padding: 4px 12px; background: #bbb; border: none;
    border-radius: 3px; cursor: pointer; font-size: 13px;
}
.window-dots { display: flex; gap: 6px; }
.dot { width: 12px; height: 12px; border-radius: 50%; }
.dot.red { background: #ff5f57; }
.dot.yellow { background: #ffbd2e; }
.dot.green { background: #28ca42; }
.address-bar {
    flex: 1; background: #fff; border: 1px solid #bbb;
    border-radius: 4px; padding: 6px 10px; font-size: 14px; color: #555;
}

.loc-wrap { background: #000; color: #0f0; min-height: 600px; }
.loc-screen { max-width: 800px; margin: 0 auto; padding: 40px 20px; }
.loc-title { text-align: center; font-size: 20px; margin-bottom: 30px; letter-spacing: 2px; }
.loc-input-box {
    display: flex; gap: 10px;
    margin-bottom: 20px; justify-content: center;
}
.loc-input-box input {
    width: 150px; padding: 8px;
    background: #000; border: 1px solid #0f0;
    color: #0f0; font-family: inherit;
}
.loc-input-box button {
    padding: 8px 20px;
    background: #000; border: 1px solid #0f0;
    color: #0f0; cursor: pointer;
}
.loc-map {
    width: 100%; height: 400px;
    border: 1px solid #0f0;
    background: #001100;
    position: relative;
    margin-bottom: 20px;
}
.loc-result {
    font-size: 14px; line-height: 1.8;
    padding: 15px; border: 1px dashed #0f0;
}
</style>
</head>
<body>
<div class="browser">
    <div class="browser-top">
        <button class="back-btn" onclick="history.back()">← 返回</button>
        <div class="window-dots">
            <div class="dot red"></div>
            <div class="dot yellow"></div>
            <div class="dot green"></div>
        </div>
        <div class="address-bar">内部定位系统</div>
    </div>

    <div class="loc-wrap">
        <div class="loc-screen">
            <div class="loc-title">=== 休眠舱定位系统 ===</div>
            <div class="loc-input-box">
                <input type="text" id="latInput" placeholder="北纬">
                <input type="text" id="lngInput" placeholder="东经">
                <button onclick="doLocate()">定位</button>
            </div>
            <div class="loc-map" id="locMap">
                <div style="position:absolute;top:50%;left:50%;transform:translate(-50%,-50%);color:#033;">等待输入坐标…</div>
            </div>
            <div class="loc-result" id="locResult">
                提示：输入基地经纬度，定位对应休眠舱。
            </div>
        </div>
    </div>
</div>

<script>
function doLocate() {
    var lat = parseFloat(document.getElementById('latInput').value.trim());
    var lng = parseFloat(document.getElementById('lngInput').value.trim());
    var map = document.getElementById('locMap');
    var res = document.getElementById('locResult');
    
    if (Math.abs(lat - 30.67) < 0.1 && Math.abs(lng - 104.06) < 0.1) {
        map.innerHTML = '<div style="position:absolute;top:45%;left:52%;transform:translate(-50%,-50%);font-size:40px;">📍</div><div style="position:absolute;top:55%;left:55%;color:#0f0;">B-08舱位 林曦</div>';
        res.innerHTML = 
            '<strong>定位成功！</strong><br>' +
            '目标：林曦<br>' +
            '舱位：西南基地 B-08<br><br>' +
            '<button onclick="location.href=\'ending-bad5.html\'" style="background:#000;border:1px solid #0f0;color:#0f0;padding:5px 12px;cursor:pointer;margin-right:10px;">直接唤醒</button>' +
            '<button onclick="location.href=\'ending-true.html\'" style="background:#000;border:1px solid #0f0;color:#0f0;padding:5px 12px;cursor:pointer;">执行记忆回溯</button>';
    } else {
        map.innerHTML = '<div style="position:absolute;top:50%;left:50%;transform:translate(-50%,-50%);color:#555;">未找到目标</div>';
        res.innerHTML = '坐标范围内未检测到对应休眠舱。';
        setTimeout(function() {
            location.href = 'ending-bad4.html';
        }, 2000);
    }
}
</script>
</body>
</html>
