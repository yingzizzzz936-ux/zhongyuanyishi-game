<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>新世纪生物科技 - 官方网站</title>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body { 
            font-family: "Microsoft YaHei", sans-serif;
            color: #333;
            background: #f5f7fa;
        }
        .header {
            height: 70px;
            background: #fff;
            border-bottom: 1px solid #e4e7ed;
            display: flex;
            align-items: center;
            padding: 0 60px;
        }
        .logo {
            font-size: 22px;
            font-weight: bold;
            color: #1a56db;
            letter-spacing: 2px;
        }
        .nav {
            margin-left: 80px;
            display: flex;
            gap: 50px;
        }
        .nav a {
            color: #606266;
            text-decoration: none;
            font-size: 15px;
        }
        .banner {
            height: 320px;
            background: linear-gradient(135deg, #1a56db 0%, #0f2d6e 100%);
            display: flex;
            align-items: center;
            justify-content: center;
            color: #fff;
            flex-direction: column;
        }
        .banner h1 {
            font-size: 42px;
            letter-spacing: 8px;
            margin-bottom: 15px;
        }
        .banner p {
            font-size: 16px;
            opacity: 0.85;
            letter-spacing: 3px;
        }
        .main {
            max-width: 1200px;
            margin: 50px auto;
            display: flex;
            gap: 30px;
            padding: 0 20px;
        }
        .card {
            flex: 1;
            background: #fff;
            padding: 30px;
            border-radius: 6px;
            box-shadow: 0 2px 12px rgba(0,0,0,0.06);
        }
        .card h3 {
            color: #1a56db;
            margin-bottom: 15px;
            font-size: 18px;
        }
        .card p {
            color: #606266;
            line-height: 1.8;
            font-size: 14px;
        }
        .footer {
            background: #2c3e50;
            color: #909399;
            padding: 20px 60px;
            margin-top: 60px;
            font-size: 13px;
            display: flex;
            justify-content: space-between;
            align-items: center;
        }
        .admin-entry a {
            color: #6b7280;
            text-decoration: none;
            font-size: 12px;
        }
        .admin-entry a:hover {
            color: #1a56db;
        }
    </style>
</head>
<body>
    <div class="header">
        <div class="logo">新世纪生物科技</div>
        <div class="nav">
            <a href="#">首页</a>
            <a href="#">关于我们</a>
            <a href="#">核心技术</a>
            <a href="#">产品中心</a>
            <a href="#">联系我们</a>
        </div>
    </div>

    <div class="banner">
        <h1>探索生命边界</h1>
        <p>用科技延伸意识的可能</p>
    </div>

    <div class="main">
        <div class="card">
            <h3>意识留存技术</h3>
            <p>基于神经映射与数字孪生的前沿研究，实现意识特征的长期稳定保存，突破生物躯体的时间限制。</p>
        </div>
        <div class="card">
            <h3>休眠舱系统</h3>
            <p>第三代低温休眠解决方案，配套全周期生命体征监测与意识同步接口，适用于长周期任务与医疗场景。</p>
        </div>
        <div class="card">
            <h3>地下基地网络</h3>
            <p>全国布局7处标准化地下研究基地，具备独立能源与安保系统，保障研究工作的连续性与保密性。</p>
        </div>
    </div>

    <!-- 页脚 + 后台入口 -->
    <div class="footer">
        <div>© 新世纪生物科技有限公司 版权所有</div>
        <div class="admin-entry">
            <a href="admin-login.html">管理后台</a>
        </div>
    </div>
</body>
</html>
