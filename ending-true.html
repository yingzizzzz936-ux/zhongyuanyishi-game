<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>结局</title>
<style>
* { box-sizing: border-box; margin: 0; padding: 0; }
body { font-family: "微软雅黑", sans-serif; background: #222; }
.browser {
    width: 100%; max-width: 1200px; margin: 20px auto;
    background: #f1f1f1; border-radius: 8px; overflow: hidden;
}
.browser-top {
    background: #dcdcdc; padding: 8px 12px;
    display: flex; align-items: center; gap: 10px;
    border-bottom: 1px solid #bbb;
}
.back-btn {
    padding: 4px 12px; background: #bbb; border: none;
    border-radius: 3px; cursor: pointer; font-size: 13px;
}
.window-dots { display: flex; gap: 6px; }
.dot { width: 12px; height: 12px; border-radius: 50%; }
.dot.red { background: #ff5f57; }
.dot.yellow { background: #ffbd2e; }
.dot.green { background: #28ca42; }
.address-bar {
    flex: 1; background: #fff; border: 1px solid #bbb;
    border-radius: 4px; padding: 6px 10px; font-size: 14px; color: #555;
}

.ending {
    min-height: 600px;
    display: flex; align-items: center; justify-content: center;
    padding: 40px; background: #fff;
}
.ending-inner { max-width: 600px; line-height: 2; }
.ending h2 { font-size: 28px; margin-bottom: 25px; color: #0066cc; }
.ending p { font-size: 15px; margin-bottom: 15px; text-indent: 2em; text-align: left; }
.restart-btn {
    margin-top: 30px; padding: 10px 25px;
    background: #ddd; border: none; border-radius: 4px;
    cursor: pointer; font-size: 14px;
}
</style>
</head>
<body>
<div class="browser">
    <div class="browser-top">
        <button class="back-btn" onclick="history.back()">← 返回</button>
        <div class="window-dots">
            <div class="dot red"></div>
            <div class="dot yellow"></div>
            <div class="dot green"></div>
        </div>
        <div class="address-bar">结局</div>
    </div>

    <div class="ending">
        <div class="ending-inner">
            <h2>真结局 · 时光回溯</h2>
            <p>你启动了记忆回溯协议。系统连接到1990年9月3日的时间节点——姐姐出生的那一天，也是她所有记忆开始的原点。</p>
            <p>意识流穿越时间的洪流，你看到了姐姐的一生：小时候牵你的手过马路，大学时兴奋地和你说她的民俗专业，出发采风前笑着说回来给你带礼物……</p>
            <p>所有被删除的记忆，一点点回到了她的意识里。</p>
            <p>休眠舱缓缓打开。姐姐睁开眼睛，看到你，愣了一下，然后叫出了你的名字。</p>
            <p>「你怎么来了？」</p>
            <p>你扶住她，什么都没说，只是紧紧抱住了她。</p>
            <p>外面的天很亮。新世纪的阴谋还藏在水面之下，但至少这一刻，你找回了你的姐姐。</p>
            <p style="text-align:center;color:#0066cc;margin-top:30px;">—— 恭喜通关 ——</p>
            <p style="text-align:center;color:#888;font-size:13px;">全流程通关时长约 90 分钟</p>
            <p style="text-align:center;"><button class="restart-btn" onclick="location.href='index.html'">重新开始</button></p>
        </div>
    </div>
</div>
</body>
</html>
