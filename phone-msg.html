<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>短信</title>
<style>
* { box-sizing: border-box; margin: 0; padding: 0; }
body { font-family: "微软雅黑", sans-serif; background: #222; }
.browser {
    width: 100%; max-width: 1200px; margin: 20px auto;
    background: #f1f1f1; border-radius: 8px; overflow: hidden;
}
.browser-top {
    background: #dcdcdc; padding: 8px 12px;
    display: flex; align-items: center; gap: 10px;
    border-bottom: 1px solid #bbb;
}
.back-btn {
    padding: 4px 12px; background: #bbb; border: none;
    border-radius: 3px; cursor: pointer; font-size: 13px;
}
.window-dots { display: flex; gap: 6px; }
.dot { width: 12px; height: 12px; border-radius: 50%; }
.dot.red { background: #ff5f57; }
.dot.yellow { background: #ffbd2e; }
.dot.green { background: #28ca42; }
.address-bar {
    flex: 1; background: #fff; border: 1px solid #bbb;
    border-radius: 4px; padding: 6px 10px; font-size: 14px; color: #555;
}

.msg-wrap { background: #f5f5f5; min-height: 600px; }
.phone-screen {
    max-width: 380px; margin: 40px auto;
    background: #fff; border-radius: 20px;
    padding: 20px;
    box-shadow: 0 4px 15px rgba(0,0,0,0.1);
}
.phone-title {
    text-align: center; font-size: 14px;
    margin-bottom: 20px; padding-bottom: 10px;
    border-bottom: 1px solid #eee;
}
.msg-item { margin-bottom: 15px; font-size: 14px; line-height: 1.6; }
.msg-item.receive { text-align: left; }
.msg-item.receive .bubble {
    display: inline-block; background: #f0f0f0;
    padding: 8px 12px; border-radius: 0 10px 10px 10px;
}
.msg-item.send { text-align: right; }
.msg-item.send .bubble {
    display: inline-block; background: #95ec69;
    padding: 8px 12px; border-radius: 10px 0 10px 10px;
}
.msg-time {
    text-align: center; font-size: 12px;
    color: #999; margin: 10px 0;
}
</style>
</head>
<body>
<div class="browser">
    <div class="browser-top">
        <button class="back-btn" onclick="history.back()">← 返回</button>
        <div class="window-dots">
            <div class="dot red"></div>
            <div class="dot yellow"></div>
            <div class="dot green"></div>
        </div>
        <div class="address-bar">短信</div>
    </div>

    <div class="msg-wrap">
        <div class="phone-screen">
            <div class="phone-title">张警官</div>
            <div class="msg-time">2024年8月25日 10:30</div>
            <div class="msg-item receive"><div class="bubble">你好，我是负责你姐姐案子的张警官。</div></div>
            <div class="msg-item send"><div class="bubble">警官你好，有消息了吗？</div></div>
            <div class="msg-item receive"><div class="bubble">我们查了她的行程，她确实去了成都，之后就没有住宿和交通记录了。</div></div>
            <div class="msg-item receive"><div class="bubble">她提到的那个公司我们也查了，正规注册的，人家说没这个人。</div></div>
            <div class="msg-item send"><div class="bubble">那论坛呢？九幽论坛，还有那个什么意识上传？</div></div>
            <div class="msg-item receive"><div class="bubble">小伙子，那些都是骗人的，你别信。</div></div>
            <div class="msg-item receive"><div class="bubble">初步判断啊，你姐姐可能是自己不想回来了。这种案子我们见多了。</div></div>
            <div class="msg-item receive"><div class="bubble">你先回去吧，有消息我们再通知你。</div></div>
            <div class="msg-time" style="margin-top:20px;">
                <button style="padding:8px 16px;background:#ddd;border:none;border-radius:4px;cursor:pointer;" onclick="location.href='ending-bad1.html'">接受结果</button>
            </div>
        </div>
    </div>
</div>
</body>
</html>
