<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>新世纪基地管理系统 v3.2</title>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body { 
            font-family: "Microsoft YaHei", sans-serif;
            background: #0f1720;
            color: #cfd8dc;
        }
        /* 返回官网入口 */
        .back-home {
            position: absolute;
            top: 18px;
            left: 25px;
            z-index: 999;
        }
        .back-home a {
            color: #78909c;
            text-decoration: none;
            font-size: 13px;
        }
        .back-home a:hover {
            color: #4fc3f7;
        }
        .top-bar {
            height: 60px;
            background: #16202c;
            border-bottom: 1px solid #1e2d3d;
            display: flex;
            align-items: center;
            justify-content: center;
            position: relative;
        }
        .system-title {
            font-size: 16px;
            letter-spacing: 4px;
            color: #4fc3f7;
        }
        .container {
            display: flex;
            height: calc(100vh - 60px);
        }
        .sidebar {
            width: 220px;
            background: #16202c;
            border-right: 1px solid #1e2d3d;
            padding: 20px 0;
        }
        .menu-item {
            padding: 14px 30px;
            font-size: 14px;
            color: #90a4ae;
            cursor: pointer;
            border-left: 3px solid transparent;
        }
        .menu-item.active {
            color: #4fc3f7;
            background: rgba(79, 195, 247, 0.08);
            border-left-color: #4fc3f7;
        }
        .content {
            flex: 1;
            padding: 30px;
        }
        .panel {
            background: #16202c;
            border: 1px solid #1e2d3d;
            border-radius: 4px;
            padding: 25px;
            margin-bottom: 20px;
        }
        .panel h2 {
            font-size: 18px;
            margin-bottom: 20px;
            color: #e0f7fa;
        }
        .status-row {
            display: flex;
            gap: 20px;
            margin-bottom: 15px;
        }
        .status-card {
            flex: 1;
            padding: 20px;
            background: #0f1720;
            border: 1px solid #1e2d3d;
            border-radius: 4px;
        }
        .status-card .num {
            font-size: 32px;
            font-weight: bold;
            color: #4fc3f7;
            margin-bottom: 8px;
        }
        .status-card .label {
            font-size: 13px;
            color: #78909c;
        }
        table {
            width: 100%;
            border-collapse: collapse;
            font-size: 14px;
        }
        th, td {
            padding: 12px 15px;
            text-align: left;
            border-bottom: 1px solid #1e2d3d;
        }
        th {
            color: #78909c;
            font-weight: normal;
            background: #0f1720;
        }
        .status-online { color: #66bb6a; }
        .status-offline { color: #ef5350; }
    </style>
</head>
<body>
    <!-- 返回官网入口 -->
    <div class="back-home">
        <a href="newcentury.html">← 新世纪官网首页</a>
    </div>

    <div class="top-bar">
        <div class="system-title">新世纪基地综合管理系统</div>
    </div>

    <div class="container">
        <div class="sidebar">
            <div class="menu-item active">运行总览</div>
            <div class="menu-item">休眠舱管理</div>
            <div class="menu-item">人员档案</div>
            <div class="menu-item">意识数据备份</div>
            <div class="menu-item">基地安保</div>
            <div class="menu-item">系统设置</div>
        </div>

        <div class="content">
            <div class="panel">
                <h2>基地运行状态</h2>
                <div class="status-row">
                    <div class="status-card">
                        <div class="num">7</div>
                        <div class="label">在线基地数</div>
                    </div>
                    <div class="status-card">
                        <div class="num">194</div>
                        <div class="label">在役休眠舱</div>
                    </div>
                    <div class="status-card">
                        <div class="num">187</div>
                        <div class="label">在册人员</div>
                    </div>
                    <div class="status-card">
                        <div class="num">98.7%</div>
                        <div class="label">系统稳定率</div>
                    </div>
                </div>
            </div>

            <div class="panel">
                <h2>休眠舱状态列表</h2>
                <table>
                    <thead>
                        <tr>
                            <th>舱体编号</th>
                            <th>所属基地</th>
                            <th>人员姓名</th>
                            <th>运行状态</th>
                        </tr>
                    </thead>
                    <tbody>
                        <tr>
                            <td>B-08</td>
                            <td>西南基地</td>
                            <td>林曦</td>
                            <td class="status-online">运行中</td>
                        </tr>
                        <tr>
                            <td>B-07</td>
                            <td>西南基地</td>
                            <td>张建国</td>
                            <td class="status-online">运行中</td>
                        </tr>
                        <tr>
                            <td>A-12</td>
                            <td>华东基地</td>
                            <td>李雯</td>
                            <td class="status-offline">维护中</td>
                        </tr>
                    </tbody>
                </table>
            </div>
        </div>
    </div>
</body>
</html>
